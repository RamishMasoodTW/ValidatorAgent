name: Angular Gatekeeper — CI Pipeline

on:
  push:
    branches: [main, master, develop]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, master, develop]

jobs:
  # ════════════════════════════════════════════════════
  # JOB 1: Quality Gate (lint, test, coverage, build)
  # ════════════════════════════════════════════════════
  quality-gate:
    name: 🛡️ Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Clean Install Dependencies
        run: npm ci

      - name: 🔒 Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      - name: 🔍 ESLint — Static Code Analysis
        run: npm run lint

      - name: 🧪 Unit Tests with Coverage
        run: npm run test:ci
        env:
          # AI keys are optional — CI runs rule-based checks if not provided
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'none' }}

      - name: 📊 Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: 🏗️ Build CLI Bundle
        run: npm run build:bundle

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-bundle
          path: dist/
          retention-days: 7

  # ════════════════════════════════════════════════════
  # JOB 2: Release (only on version tags, e.g. v1.2.3)
  # ════════════════════════════════════════════════════
  release:
    name: 🚀 GitHub Release
    needs: quality-gate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Clean Install Dependencies
        run: npm ci

      - name: 🏗️ Build Full Executable
        run: npm run build:exe

      - name: 📦 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/engine.exe
            dist/installer.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
