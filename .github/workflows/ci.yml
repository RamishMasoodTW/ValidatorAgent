name: Angular CI/CD Enterprise Pipeline

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  validate-and-test:
    name: 🛡️ Validate, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Clean Install Dependencies
        run: npm ci

      - name: 🔒 Security & Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      - name: 📐 Lint & Architecture Checks
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          fi

      - name: 🧪 Unit Tests with Headless Browser & Coverage
        run: |
          if npm run | grep -q "test:ci"; then
            npm run test:ci
          elif npm run | grep -q "test"; then
            npx ng test --watch=false --browsers=ChromeHeadless
          fi

      - name: 🏗️ Production Build Compilation
        run: npm run build -- --configuration=production

      - name: 📤 Archive Production Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
