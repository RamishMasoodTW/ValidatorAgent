image: node:20

stages:
  - validate
  - test
  - build
  - release

# ──────────────────────────────────────────────
# Include GitLab built-in SAST template
# ──────────────────────────────────────────────
include:
  - template: Security/SAST.gitlab-ci.yml

variables:
  # Scope SAST only to source — exclude generated/test dirs
  SAST_EXCLUDED_PATHS: "tests/, node_modules/, dist/, build/"

# ──────────────────────────────────────────────
# Cache node_modules across pipeline runs
# ──────────────────────────────────────────────
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/

before_script:
  - node --version
  - npm --version
  - npm ci --cache .npm --prefer-offline

# ──────────────────────────────────────────────
# STAGE: validate
# ──────────────────────────────────────────────
security_audit:
  stage: validate
  script:
    - npm audit --audit-level=high
  allow_failure: false

lint:
  stage: validate
  script:
    - npm run lint
  allow_failure: false

package_integrity:
  stage: validate
  script:
    - npm run build:pack
  allow_failure: false

# ──────────────────────────────────────────────
# STAGE: test
# ──────────────────────────────────────────────
unit_tests:
  stage: test
  image: node:20
  script:
    - npm run test:ci
  coverage: '/Lines\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: 14 days

# ──────────────────────────────────────────────
# STAGE: build
# ──────────────────────────────────────────────
build_bundle:
  stage: build
  script:
    - npm run build:bundle
  artifacts:
    paths:
      - build/
      - dist/
    expire_in: 1 week
  only:
    - main
    - master
    - develop
    - tags

smoke_test:
  stage: build
  needs:
    - build_bundle
  script:
    - npm run test:smoke
  only:
    - main
    - master
    - develop
    - tags

# ──────────────────────────────────────────────
# STAGE: release (CD on version tags)
# ──────────────────────────────────────────────
release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []
  needs:
    - build_bundle
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - echo "Publishing automated release for $CI_COMMIT_TAG"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Automated GitLab Release for Angular Gatekeeper $CI_COMMIT_TAG'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: 'Windows x64 ZIP (Angular-Gatekeeper-Windows-x64.zip)'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/Angular-Gatekeeper-Windows-x64.zip?job=build_bundle'
          link_type: package
        - name: 'Setup Installer (AngularGatekeeperSetup.exe)'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/AngularGatekeeperSetup.exe?job=build_bundle'
          link_type: package
        - name: 'Engine Binary (engine.exe)'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/engine.exe?job=build_bundle'
          link_type: package
        - name: 'SHA256 Checksums'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/SHA256SUMS.txt?job=build_bundle'
          link_type: other
